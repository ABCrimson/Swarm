# pnpm 11+ reads project settings only from this file — `.npmrc` is
# consulted for auth and registry keys alone, so the house exact-pin and
# engine rules live here.
saveExact: true
engineStrict: true

# Supply-chain gates: a version must be at least 24h old before it
# resolves (an explicit value also makes the check strict), and a package
# may never lose trust evidence (provenance / trusted publishing) relative
# to its earlier releases.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

# Same-day pins that deliberately bypass the 24h gate. `pnpm add`,
# `update` and `remove` prune entries the lockfile no longer resolves.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  # Published 2026-10-29/30; pruned automatically once mature (minimumReleaseAgeExcludePrune).
  - "@playwright/test@1.65.0-alpha-2026-10-30"
  - "@typescript/typescript-darwin-arm64@7.1.0-dev.20261030.1"
  - "@typescript/typescript-darwin-x64@7.1.0-dev.20261030.1"
  - "@typescript/typescript-linux-arm64@7.1.0-dev.20261030.1"
  - "@typescript/typescript-linux-arm@7.1.0-dev.20261030.1"
  - "@typescript/typescript-linux-x64@7.1.0-dev.20261030.1"
  - "@typescript/typescript-win32-arm64@7.1.0-dev.20261030.1"
  - "@typescript/typescript-win32-x64@7.1.0-dev.20261030.1"
  - "@xterm/addon-fit@0.12.0-beta.332"
  - "@xterm/addon-webgl@0.20.0-beta.329"
  - "@xterm/xterm@6.1.0-beta.336"
  - framer-motion@14.9.0
  - knip@6.44.0
  - motion-dom@14.9.0
  - motion@14.9.0
  - playwright-core@1.65.0-alpha-2026-10-30
  - playwright@1.65.0-alpha-2026-10-30
  - typescript@7.1.0-dev.20261030.1

# The React Compiler's WASI binding (oxc-transform-react 0.156.0) pins @emnapi/core and
# @emnapi/runtime to 2.0.0-alpha.6 but resolves @napi-rs/wasm-runtime 1.2.6 through
# ~1.2.6, which peers "^1.7.1 || 2.0.0-beta.2" and calls emnapi's beta API
# (addonModule, renamed from napiModule). With alpha.6 the binding dies on load
# ("Cannot set properties of undefined (setting 'initWorker')") and the loader silently
# falls back to native, so `NAPI_RS_FORCE_WASI=true pnpm check:compiler` fails. Pin the
# beta the runtime declares until the binding's own pins catch up.
overrides:
  "@oxc-transform-react/binding-wasm32-wasip1>@emnapi/core": 2.0.0-beta.2
  "@oxc-transform-react/binding-wasm32-wasip1>@emnapi/runtime": 2.0.0-beta.2
