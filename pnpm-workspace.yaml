# The React Compiler's WASI binding (oxc-transform-react 0.157.0) pins @emnapi/core and
# @emnapi/runtime to 2.0.0-alpha.6 but resolves @napi-rs/wasm-runtime 1.2.7 through
# ~1.2.7, which peers "^1.7.1 || 2.0.0-beta.2 || 2.0.0-beta.3" and calls emnapi's beta
# API (addonModule, renamed from napiModule). With alpha.6 the binding dies on load
# ("Cannot set properties of undefined (setting 'initWorker')") and the loader silently
# falls back to native, so `NAPI_RS_FORCE_WASI=true pnpm check:compiler` fails. Pin the
# newest beta the runtime declares until the binding's own pins catch up.
overrides:
  "@oxc-transform-react/binding-wasm32-wasip1>@emnapi/core": 2.0.0-beta.3
  "@oxc-transform-react/binding-wasm32-wasip1>@emnapi/runtime": 2.0.0-beta.3

# @vitejs/plugin-react 6.2.1 caps its optional oxc-transform-react peer at <0.157.0
# (vitejs/vite-plugin-react#1540, 2026-11-02, an upper bound on a 0.x series, not a known
# break; main still says ">=0.152.0 <0.157.0" on 2026-11-03). 0.157.0 only adds the
# `typescript` option (oxc-project/oxc 8dd67a6), and the full gate including both
# check:compiler runs is green on it. Drop this once plugin-react widens the range.
# @crimson_dev/use-resize-observer 1.0.1 peers react ">=19.3.0", and semver orders the
# React canary 19.3.0-canary-e84e1492-20261031 (published 2026-10-31, after 19.3.1 on 2026-10-14)
# below 19.3.0 because it is a prerelease. Drop this when react leaves the canary pin.
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>oxc-transform-react": 0.157.0
    "@crimson_dev/use-resize-observer>react": 19.3.0-canary-e84e1492-20261031
