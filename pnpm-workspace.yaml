# pnpm 11+ reads project settings only from this file — `.npmrc` is
# consulted for auth and registry keys alone, so the house exact-pin and
# engine rules live here.
saveExact: true
engineStrict: true

# Supply-chain gates: a version must be at least 24h old before it
# resolves (an explicit value also makes the check strict), and a package
# may never lose trust evidence (provenance / trusted publishing) relative
# to its earlier releases.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel 7's semver range (^6.3.1) — a 2023 backport published without the
  # provenance the 7.x line already had. Required by @babel/core 7.29.7, the
  # React Compiler's Babel fallback (vite.config.ts): on Babel 8 every
  # babel-plugin-react-compiler build silently skips destructured-default
  # components (react#36868, still open on 2026-10-10 with its fix PRs
  # unmerged and no compiler build since 2026-05-08; held in
  # .peak-modern-holds.json).
  - semver@6.3.1

# Same-day pins that deliberately bypass the 24h gate. `pnpm add`,
# `update` and `remove` prune entries the lockfile no longer resolves.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - typescript@7.1.0-dev.20261010.1
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261010.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261010.1'
