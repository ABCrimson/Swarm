# Rust workspace root (virtual manifest). Members:
#   src-tauri/         swarm-desktop, the Tauri desktop shell
#   crates/swarm-core  the Tauri-free domain library both shells embed
#   crates/swarmd      the headless daemon
# Cargo.lock, clippy.toml and deny.toml live here too, and `target/` is
# created here: run cargo from the repo root.
[workspace]
members  = ["src-tauri", "crates/*"]
# Explicit: a virtual manifest has no root package whose edition could
# imply the edition-2024 resolver.
resolver = "3"

[workspace.package]
# Crate version for every workspace member. package.json is the app's
# version source: src-tauri/tauri.conf.json sets `version` to
# "../package.json", so the bundle and updater version derive from it.
# Cargo cannot read package.json, so this value is held in lockstep with
# it by swarm-desktop's `app_version_resolves_from_package_json` test.
version      = "0.13.1"
edition      = "2024"
# `[profile.release] trim-paths` is stable from 1.101 (cargo#17488), the
# trim_prefix/trim_suffix and std::mem::DropGuard APIs the code uses from
# 1.100; rust-toolchain.toml pins the matching 1.101 nightly.
rust-version = "1.101"
license      = "MIT"
repository   = "https://github.com/ABCrimson/Swarm"
publish      = false

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code              = "deny"
unsafe_op_in_unsafe_fn   = "deny"
missing_unsafe_on_extern = "deny"

[workspace.lints.clippy]
# Suppressions must be `#[expect(lint, reason = "...")]`, which fails
# the build once the suppressed lint stops firing.
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
must_use_without_reason         = "deny"
undocumented_unsafe_blocks      = "deny"
# Enforce clippy.toml's house rules (std::sync::Mutex/RwLock are banned
# in favour of parking_lot).
disallowed_types                = "deny"
disallowed_methods              = "deny"
dbg_macro                       = "deny"
todo                            = "deny"
unimplemented                   = "deny"

[workspace.lints.cargo]
unused_dependencies             = "deny"
unused_workspace_dependencies   = "deny"
# A member without `[lints] workspace = true` would silently skip every
# lint table here.
missing_lints_inheritance       = "deny"
# A `[workspace.package]` key no member inherits is dead metadata.
unused_workspace_package_fields = "deny"
# A misspelled or retired lint name in these tables fails the build.
unknown_lints                   = "deny"

[workspace.dependencies]
swarm-core                = { path = "crates/swarm-core" }
# ── Tauri 3.0 alpha stack (desktop shell) ────────────────────────────
# v3 selects the webview runtime by depending on a runtime crate and
# passing its attributes to `Builder::runtime`; the runtime-wide
# features (`devtools`, `unstable`, `tracing`, `x11`, `dbus`) moved onto
# tauri-runtime-wry. swarm-desktop's own `devtools` feature forwards to
# it; debug builds get the inspector regardless (tauri-runtime-wry and
# wry gate it on `any(debug_assertions, feature = "devtools")`).
tauri                     = { version = "=3.0.0-alpha.4", features = ["image-png"] }
tauri-runtime-wry         = "=3.0.0-alpha.4"
tauri-build               = "=3.0.0-alpha.3"
tauri-plugin-fs           = "=3.0.0-alpha.2"
tauri-plugin-dialog       = "=3.0.0-alpha.3"
tauri-plugin-opener       = "=3.0.0-alpha.2"
tauri-plugin-store        = "=3.0.0-alpha.2"
tauri-plugin-updater      = "=3.0.0-alpha.2"
tauri-plugin-notification = "=3.0.0-alpha.2"
# Dev-only, swarm-desktop's capability contract test: the matcher
# tauri-plugin-opener evaluates URL scopes with (already in the tree
# through it, at this exact version).
glob                      = "=0.3.4"
tokio                     = { version = "=1.53.2", features = ["full"] }
portable-pty              = "=0.9.0"
serde                     = { version = "=1.0.229", features = ["derive"] }
serde_json                = "=1.0.151"
anyhow                    = "=1.0.104"
thiserror                 = "=2.0.21"
tracing                   = "=0.1.44"
tracing-subscriber        = { version = "=0.3.23", features = ["json", "env-filter"] }
uuid                      = { version = "=1.28.0", features = ["v4", "serde"] }
dashmap                   = "=7.0.0-rc2"
parking_lot               = "=0.12.5"
rusqlite                  = { version = "=0.40.2", features = ["bundled"] }
regex                     = "=1.13.1"
sysinfo                   = "=0.39.6"
tokio-util                = { version = "=0.7.20", features = ["rt"] }
# ── swarmd (Phase 2 headless daemon) ─────────────────────────────────
# axum is the one genuinely NEW dependency this workspace takes on for
# swarmd — nothing else in the tree pulled in an HTTP/WS server stack.
# See docs/architecture.md's "Runtime Modes" section for the
# cargo-tree-verified justification.
axum                      = { version = "=0.8.9", features = ["ws"] }
# swarmd-only: ServeDir (--serve-ui) and its security response headers.
# Not shared with the desktop shell: tauri reaches tower-http only
# through reqwest, which resolves the 0.6 line, so the lock carries 0.6
# (desktop) and 0.7 (swarmd) side by side.
tower-http                = { version = "=0.7.1", features = ["fs", "set-header"] }
# Already present transitively at this exact version (uuid v4's own
# randomness source) — made direct for the 256-bit daemon-token.
getrandom                 = "=0.4.3"
# Already present transitively at this exact version (pulled in by
# something in the existing dependency tree) — made direct for the
# constant-time token comparison on the WS auth path.
subtle                    = "=2.6.1"
# Dev-only, swarmd's integration test: drives a real WS client against a
# real swarmd instance. The newest release; axum 0.8's `ws` feature still
# resolves the 0.29 line, so the dev graph carries both tungstenite
# versions while the shipped swarmd binary carries only axum's.
tokio-tungstenite         = "=0.30.0"
# Already present transitively (hyper/tower's own plumbing) — made
# direct for `WebSocket::split()` in swarmd's per-connection handler.
futures-util              = "=0.3.34"
# Already present transitively at this exact version — made direct for
# swarmd, which mints the daemon token into a private temporary file and
# links it into place without clobbering (its tests use temp dirs too).
tempfile                  = "=3.27.0"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
# Remap the build machine's absolute paths (workspace, registry, sysroot)
# out of everything the binaries embed: panic messages, file!(), debug
# info. Stable since cargo#17488, with no default for built-in profiles,
# so without this a release names the CI runner's (or a developer's)
# directories.
trim-paths    = "all"
# `panic` stays at its default, "unwind". A panic then ends only the
# task or thread it happens on: swarm-core turns a panicked
# `spawn_blocking` job into an error for that one command, and a
# panicking WebSocket connection or agent turn leaves every other worker
# running, in the desktop app and in swarmd. "abort" would kill the whole
# process, and with it every agent and terminal, and would make release
# builds behave unlike the tests, which always unwind. It saves ~16% of
# swarm-desktop's and ~9% of swarmd's stripped size (x86_64 Linux, this
# profile, measured 2026-09-23).

[profile.dev]
opt-level = 1
