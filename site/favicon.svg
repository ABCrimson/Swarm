<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SWARM">
  <defs>
    <linearGradient id="g" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7dd96"/>
      <stop offset="1" stop-color="#dfa634"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="14" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0a838" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e0a838" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- dark rounded app tile: reads on light and dark browser chrome alike -->
  <rect width="32" height="32" rx="7.5" fill="#0b1020"/>
  <rect width="32" height="32" rx="7.5" fill="url(#glow)"/>
  <!-- honeycomb cell (the hive / swarm) -->
  <polygon points="16,4.6 25.6,10.1 25.6,21.9 16,27.4 6.4,21.9 6.4,10.1"
           fill="none" stroke="url(#g)" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- swarm nodes converging onto one ordered center -->
  <g stroke="#e0a838" stroke-opacity="0.5" stroke-width="1.1">
    <line x1="16" y1="16" x2="11" y2="11.4"/>
    <line x1="16" y1="16" x2="21" y2="11.4"/>
    <line x1="16" y1="16" x2="16" y2="22.6"/>
  </g>
  <circle cx="11" cy="11.4" r="1.55" fill="#f7dd96"/>
  <circle cx="21" cy="11.4" r="1.55" fill="#f7dd96"/>
  <circle cx="16" cy="22.6" r="1.55" fill="#f7dd96"/>
  <circle cx="16" cy="16" r="3.4" fill="url(#g)"/>
  <circle cx="16" cy="16" r="3.4" fill="none" stroke="#0b1020" stroke-width="0.9"/>
</svg>
