<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SWARM">
  <style>
    .tile { fill: oklch(0.177 0.034 269.6); }
    .light { stop-color: oklch(0.903 0.094 90.2); }
    .deep { stop-color: oklch(0.76 0.14 80.3); }
    .glow { stop-color: oklch(0.765 0.139 80.7); }
    .spoke { stroke: oklch(0.765 0.139 80.7 / 0.5); }
    .node { fill: oklch(0.903 0.094 90.2); }
    .ring { stroke: oklch(0.177 0.034 269.6); }
  </style>
  <defs>
    <linearGradient id="g" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="light"/>
      <stop offset="1" class="deep"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="14" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="glow" stop-opacity="0.38"/>
      <stop offset="1" class="glow" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- A dark app tile, so the mark reads on light and dark browser chrome alike. -->
  <rect width="32" height="32" rx="7.5" class="tile"/>
  <rect width="32" height="32" rx="7.5" fill="url(#glow)"/>
  <!-- The hive cell. -->
  <polygon points="16,4.6 25.6,10.1 25.6,21.9 16,27.4 6.4,21.9 6.4,10.1"
           fill="none" stroke="url(#g)" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- Workers converging on one ordered centre: the event log. -->
  <g class="spoke" stroke-width="1.1">
    <line x1="16" y1="16" x2="11" y2="11.4"/>
    <line x1="16" y1="16" x2="21" y2="11.4"/>
    <line x1="16" y1="16" x2="16" y2="22.6"/>
  </g>
  <circle cx="11" cy="11.4" r="1.55" class="node"/>
  <circle cx="21" cy="11.4" r="1.55" class="node"/>
  <circle cx="16" cy="22.6" r="1.55" class="node"/>
  <circle cx="16" cy="16" r="3.4" fill="url(#g)"/>
  <circle cx="16" cy="16" r="3.4" fill="none" class="ring" stroke-width="0.9"/>
</svg>
