[package]
name    = "swarm-core"
version = "0.11.2"
edition = "2024"

[dependencies]
tauri               = { version = "=2.11.5",  features = ["devtools", "image-png"] }
tokio               = { version = "=1.52.3",  features = ["full"] }
tokio-stream        = { version = "=0.1.18",  features = ["net"] }
portable-pty        = "=0.9.0"
reqwest             = { version = "=0.13.4",  features = ["json", "stream", "rustls"], default-features = false }
serde               = { version = "=1.0.228", features = ["derive"] }
serde_json          = "=1.0.150"
anyhow              = "=1.0.103"
thiserror           = "=2.0.18"
tracing             = "=0.1.44"
tracing-subscriber  = { version = "=0.3.23", features = ["json", "env-filter"] }
uuid                = { version = "=1.23.4", features = ["v4", "serde"] }
dashmap             = "=7.0.0-rc2"
parking_lot         = "=0.12.5"
rusqlite            = { version = "=0.40.1", features = ["bundled"] }
tauri-plugin-fs     = "=2.5.1"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-shell  = "=2.3.5"
tauri-plugin-store        = "=2.4.3"
sysinfo                   = "=0.39.6"
tauri-plugin-updater      = "=2.10.1"
tauri-plugin-notification  = "=2.3.3"
tokio-util                = { version = "=0.7.18", features = ["rt"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.dev]
opt-level = 1
