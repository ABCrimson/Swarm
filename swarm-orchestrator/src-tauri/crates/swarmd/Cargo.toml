[package]
name    = "swarmd"
version.workspace = true
edition = "2024"

[lib]
name = "swarmd"
path = "src/lib.rs"

[[bin]]
name = "swarmd"
path = "src/main.rs"

[dependencies]
swarm-core   = { path = "../swarm-core" }
tokio        = { workspace = true }
axum         = { workspace = true }
tower-http   = { workspace = true }
tower        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
uuid         = { workspace = true }
getrandom    = { workspace = true }
subtle       = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }

# NOTE: [profile.*] is deliberately NOT redefined here — profiles are
# workspace-root-only in Cargo; src-tauri/Cargo.toml's [profile.release]
# (fat LTO, strip, codegen-units=1) already applies to every workspace
# member, swarmd included, for free.
