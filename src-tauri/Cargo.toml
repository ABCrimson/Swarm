[package]
name    = "swarm-desktop"
version.workspace = true
edition = "2024"

[workspace]
members = ["crates/swarm-core", "crates/swarmd"]

[workspace.package]
# Single source of truth for the workspace crate version. tauri.conf.json
# and package.json are the other two version sites and
# are intentionally not derived from this one.
version = "0.13.1"

[workspace.dependencies]
tauri                      = { version = "=2.11.5",  features = ["devtools", "image-png"] }
tokio                      = { version = "=1.53.1",  features = ["full"] }
tokio-stream               = { version = "=0.1.19",  features = ["net"] }
portable-pty                = "=0.9.0"
reqwest                     = { version = "=0.13.4",  features = ["json", "stream", "rustls"], default-features = false }
serde                       = { version = "=1.0.229", features = ["derive"] }
serde_json                  = "=1.0.151"
anyhow                      = "=1.0.104"
thiserror                   = "=2.0.20"
tracing                     = "=0.1.44"
tracing-subscriber          = { version = "=0.3.23", features = ["json", "env-filter"] }
uuid                        = { version = "=1.24.1", features = ["v4", "serde"] }
dashmap                     = "=6.2.1"
parking_lot                 = "=0.12.5"
rusqlite                    = { version = "=0.40.2", features = ["bundled"] }
regex                       = "=1.13.1"
tauri-plugin-fs             = "=2.5.1"
tauri-plugin-dialog         = "=2.7.2"
tauri-plugin-shell          = "=2.3.5"
tauri-plugin-store          = "=2.4.4"
sysinfo                     = "=0.39.6"
tauri-plugin-updater        = "=2.10.1"
tauri-plugin-notification   = "=2.3.3"
tokio-util                  = { version = "=0.7.19", features = ["rt"] }
tauri-build                 = { version = "=2.6.3", features = [] }
# ── swarmd (Phase 2 headless daemon) ─────────────────────────────────
# axum is the one genuinely NEW dependency this workspace takes on for
# swarmd — nothing else in the tree pulled in an HTTP/WS server stack.
# See docs/architecture.md's "Runtime Modes" section for the
# cargo-tree-verified justification.
axum                       = { version = "=0.8.9", features = ["ws"] }
# Already present transitively (tauri's asset protocol pulls it in) —
# made a direct swarmd dependency for ServeDir (--serve-ui) and the
# browser-build CSP response header, adding zero new crates to the tree.
tower-http                  = { version = "=0.7.0", features = ["fs", "set-header", "trace"] }
tower                       = { version = "=0.5.3", features = ["util"] }
# Already present transitively at this exact version (uuid v4's own
# randomness source) — made direct for the 256-bit daemon-token.
getrandom                   = "=0.4.3"
# Already present transitively at this exact version (pulled in by
# something in the existing dependency tree) — made direct for the
# constant-time token comparison on the WS auth path.
subtle                      = "=2.6.1"
# Unix-only, already present transitively via tokio/mio — made a direct
# target-gated dependency for the single-instance advisory flock().
libc                        = "=0.2.189"
# Dev-only, swarmd's integration test: drives a real WS client against a
# real swarmd instance. Same tokio-tungstenite version axum's own `ws`
# feature resolves internally, so this adds no new crate VERSION to the
# tree, only a dev-time direct dependency on one already present.
tokio-tungstenite            = "=0.29.0"
# Already present transitively (hyper/tower's own plumbing) — made
# direct for `WebSocket::split()` in swarmd's per-connection handler.
futures-util                 = "=0.3.34"

[dependencies]
tauri                      = { workspace = true }
tauri-plugin-fs            = { workspace = true }
tauri-plugin-dialog        = { workspace = true }
tauri-plugin-shell         = { workspace = true }
tauri-plugin-store         = { workspace = true }
tauri-plugin-updater       = { workspace = true }
tauri-plugin-notification  = { workspace = true }
tokio                      = { workspace = true }
tokio-util                 = { workspace = true }
serde                      = { workspace = true }
serde_json                 = { workspace = true }
uuid                       = { workspace = true }
tracing                    = { workspace = true }
tracing-subscriber         = { workspace = true }
anyhow                     = { workspace = true }
sysinfo                    = { workspace = true }
parking_lot                = { workspace = true }
swarm-core                 = { path = "crates/swarm-core" }

[build-dependencies]
tauri-build = { workspace = true }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.dev]
opt-level = 1
