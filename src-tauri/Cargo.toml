# swarm-desktop, the Tauri desktop shell. A member of the workspace
# defined by the repo-root Cargo.toml, which holds the shared package
# metadata, dependency pins, lints and profiles.
[package]
name                   = "swarm-desktop"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[features]
# Ships the web inspector in RELEASE builds (e.g. `pnpm tauri build
# --features devtools` for a debuggable release). Off by default so
# signed releases never carry it; debug builds (`pnpm tauri:dev`,
# `cargo run`) have the inspector without this feature, because
# tauri-runtime-wry and wry enable it on `debug_assertions`.
devtools = ["tauri-runtime-wry/devtools"]
# Instruments Tauri itself for measurement (e.g. `pnpm tauri dev
# --features tracing`). tauri then opens spans around app setup, plugin
# registration and hooks, IPC request handling and event emission (the
# `app::emit` span and `emit::run` inside it, around every event the
# shell forwards to the webview), and tauri-runtime-wry around window
# and webview creation and the script evaluation that delivers an event.
# The default filters of `init_tracing` leave them out: set `RUST_LOG`
# to name their targets (e.g. `RUST_LOG=tauri=trace,swarm_desktop=debug`)
# and attach a span-aware layer to read their timings. Off by default:
# it is a profiling build, the measurement of event delivery cost before
# and after a change to it.
tracing = ["tauri/tracing", "tauri-runtime-wry/tracing"]

[dependencies]
swarm-core                = { workspace = true }
tauri                     = { workspace = true }
tauri-runtime-wry         = { workspace = true }
tauri-plugin-fs           = { workspace = true }
tauri-plugin-dialog       = { workspace = true }
tauri-plugin-opener       = { workspace = true }
tauri-plugin-store        = { workspace = true }
tauri-plugin-updater      = { workspace = true }
tauri-plugin-notification = { workspace = true }
tokio                     = { workspace = true }
serde                     = { workspace = true }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
parking_lot               = { workspace = true }
tracing                   = { workspace = true }
tracing-subscriber        = { workspace = true }
# The release log's writer thread (`tracing_appender::non_blocking`).
tracing-appender          = { workspace = true }

[dev-dependencies]
# `test` adds tauri::test's MockRuntime, which drives real IPC requests
# through the app's invoke handler without a webview.
tauri = { workspace = true, features = ["test"] }
glob  = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
