# swarm-desktop, the Tauri desktop shell. A member of the workspace
# defined by the repo-root Cargo.toml, which holds the shared package
# metadata, dependency pins, lints and profiles.
[package]
name                   = "swarm-desktop"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[features]
# Ships the web inspector in RELEASE builds (e.g. `pnpm tauri build
# --features devtools` for a debuggable release). Off by default so
# signed releases never carry it; debug builds (`pnpm tauri:dev`,
# `cargo run`) have the inspector without this feature, because
# tauri-runtime-wry and wry enable it on `debug_assertions`.
devtools = ["tauri-runtime-wry/devtools"]

[dependencies]
swarm-core                = { workspace = true }
tauri                     = { workspace = true }
tauri-runtime-wry         = { workspace = true }
tauri-plugin-fs           = { workspace = true }
tauri-plugin-dialog       = { workspace = true }
tauri-plugin-opener       = { workspace = true }
tauri-plugin-store        = { workspace = true }
tauri-plugin-updater      = { workspace = true }
tauri-plugin-notification = { workspace = true }
tokio                     = { workspace = true }
serde                     = { workspace = true }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
tracing                   = { workspace = true }
tracing-subscriber        = { workspace = true }
# The release log's writer thread (`tracing_appender::non_blocking`).
# Pinned here rather than in the workspace table: swarm-desktop is its
# only user. It adds only itself and the small `symlink` crate to the
# lock; crossbeam-channel, time, thiserror and tracing-subscriber are
# already in the tree.
tracing-appender          = "=0.2.5"

[dev-dependencies]
# `test` adds tauri::test's MockRuntime, which drives real IPC requests
# through the app's invoke handler without a webview.
tauri = { workspace = true, features = ["test"] }
glob  = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
