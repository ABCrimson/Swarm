# cargo-deny 0.20 supply-chain gate for the Rust workspace:
# `cargo deny check` (advisories, licenses, bans, sources).
[graph]
# The four release triples; platform-only dependencies of other targets
# are not part of any shipped binary.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Unmaintained notices only fail for direct dependencies. Tauri 3 alpha's
# Linux GTK3 stack carries one transitively: proc-macro-error
# (RUSTSEC-2024-0370, via glib-macros).
unmaintained = "workspace"
# Unsound advisories fail for every crate in the graph, transitive ones
# included (the default scope is "workspace", which would hide them); each
# accepted one is listed below with its reason and re-checked at every bump.
unsound = "all"
ignore = [
  # glib 0.18.5 reaches the Linux target only, through Tauri 3 alpha's GTK3
  # stack (gtk 0.18 via tauri, tauri-runtime-wry, tao, wry, muda, webkit2gtk).
  # The unsoundness is confined to glib::VariantStrIter, which nothing in this
  # workspace or that stack iterates; the fix, glib 0.20, pairs with GTK4,
  # which Tauri tracks in its 3.0 milestone (tauri-apps/tauri#14684).
  { id = "RUSTSEC-2024-0429", reason = "glib::VariantStrIter unsoundness; transitive via Tauri 3 alpha's GTK3 stack on Linux; fixed only by glib 0.20 (GTK4), which Tauri 3 does not use yet; the affected iterator is not called" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
]

[licenses.private]
# The workspace crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[bans.std-replacements]
scope = "workspace"
level = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
