[package]
name                   = "swarm-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
tokio         = { workspace = true }
tokio-util    = { workspace = true }
portable-pty  = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
uuid          = { workspace = true }
dashmap       = { workspace = true }
parking_lot   = { workspace = true }
rusqlite      = { workspace = true }
regex         = { workspace = true }
# `swarm_core::metrics` (moved here from the desktop shell so both
# shells' Runtime construction can start the same background collection
# loop) — already a workspace dep the desktop shell used at runtime;
# zero new crate.
sysinfo       = { workspace = true }

[dev-dependencies]
# Test-only, for the credential-leak-in-waiting span-capture test
# (worker::lifecycle::tests) — captures formatted tracing output into
# an in-memory buffer via a custom MakeWriter so the test can assert no
# env value ever appears in it. Exact-pinned via the workspace, same
# version swarm-desktop already depends on at runtime.
tracing-subscriber = { workspace = true }
