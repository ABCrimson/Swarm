[package]
name                   = "swarmd"
description            = "Headless SWARM Orchestrator daemon: the swarm-core runtime behind an authenticated WebSocket"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
swarm-core         = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
axum               = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
getrandom          = { workspace = true }
subtle             = { workspace = true }
futures-util       = { workspace = true }
parking_lot        = { workspace = true }
tempfile           = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
uuid              = { workspace = true }

# Profiles live in the root manifest only (Cargo ignores them in member
# crates); its [profile.release] applies to swarmd as well.
