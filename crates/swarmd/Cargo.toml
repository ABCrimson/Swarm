[package]
name                   = "swarmd"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
swarm-core         = { workspace = true }
tokio              = { workspace = true }
axum               = { workspace = true }
tower-http         = { workspace = true }
tower              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }
getrandom          = { workspace = true }
subtle             = { workspace = true }
futures-util       = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }

# NOTE: [profile.*] is deliberately NOT redefined here — profiles are
# workspace-root-only in Cargo; the repo-root Cargo.toml's
# [profile.release] (fat LTO, strip, codegen-units=1) already applies to
# every workspace member, swarmd included, for free.
