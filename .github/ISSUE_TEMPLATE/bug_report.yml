name: Bug Report
description: File a bug report for SWARM Orchestrator
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App Version
      description: Which version of SWARM Orchestrator are you using?
      placeholder: "0.9.9"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which operating system are you on?
      options:
        - Windows 11
        - macOS (ARM64)
        - macOS (x86_64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs or attach screenshots
    validations:
      required: false
