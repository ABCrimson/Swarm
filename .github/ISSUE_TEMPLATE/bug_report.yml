name: Bug Report
description: File a bug report for SWARM Orchestrator
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App Version
      description: >-
        The desktop app shows it under Settings → About; the daemon prints it
        with `swarmd --version`.
      placeholder: "0.14.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the bug occur?
      options:
        - Windows (x86_64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (.deb)
        - swarmd Daemon / Browser UI
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: "Windows 11 26H1, macOS 26.1, Ubuntu 26.04, …"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe The Bug
      description: A clear description of what the bug is
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Screenshots
      description: Paste any relevant logs or attach screenshots
      render: text
    validations:
      required: false
