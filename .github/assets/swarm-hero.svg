<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SWARM Orchestrator — the product loop past T3 Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) rotate(90) scale(300 460)">
      <stop stop-color="#ebb84a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ebb84a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 330) rotate(-45) scale(300 380)">
      <stop stop-color="#8f7fe0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8f7fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="70" y1="70" x2="470" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fd"/>
      <stop offset="0.6" stop-color="#f0d89a"/>
      <stop offset="1" stop-color="#ebb84a"/>
    </linearGradient>
    <linearGradient id="spine" x1="693" y1="60" x2="693" y2="275" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ebb84a" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#f5d98a"/>
      <stop offset="1" stop-color="#ebb84a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5d98a"/>
      <stop offset="1" stop-color="#e0a838"/>
    </linearGradient>
  </defs>

  <!-- ground + glows -->
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#goldGlow)"/>
  <rect width="1200" height="340" rx="22" fill="url(#violetGlow)"/>

  <!-- faint honeycomb texture, far right -->
  <g stroke="#ebb84a" stroke-opacity="0.06" fill="none" stroke-width="1.2">
    <polygon points="1040,44 1070,61 1070,95 1040,112 1010,95 1010,61"/>
    <polygon points="1100,44 1130,61 1130,95 1100,112 1070,95 1070,61"/>
    <polygon points="1070,95 1100,112 1100,146 1070,163 1040,146 1040,112"/>
    <polygon points="1130,95 1160,112 1160,146 1130,163 1100,146 1100,112"/>
    <polygon points="1040,146 1070,163 1070,197 1040,214 1010,197 1010,163"/>
    <polygon points="1100,146 1130,163 1130,197 1100,214 1070,197 1070,163"/>
  </g>

  <!-- the ordered spine (single event log): many agents -> one ordered stream -->
  <rect x="686" y="62" width="14" height="212" rx="7" fill="#ebb84a" fill-opacity="0.10"/>
  <rect x="690" y="62" width="6" height="212" rx="3" fill="url(#spine)"/>

  <!-- converging connectors -->
  <g stroke="#ebb84a" fill="none">
    <path d="M693 96 L812 74"   stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M693 110 L884 96"  stroke-opacity="0.30" stroke-width="1.1"/>
    <path d="M693 130 L980 70"  stroke-opacity="0.22" stroke-width="1"/>
    <path d="M693 150 L860 150" stroke-opacity="0.5"  stroke-width="1.4"/>
    <path d="M693 150 L1040 128" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M693 168 L936 186" stroke-opacity="0.32" stroke-width="1.1"/>
    <path d="M693 188 L820 214" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M693 206 L1000 210" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M693 224 L890 252" stroke-opacity="0.3"  stroke-width="1.1"/>
    <path d="M693 240 L980 262" stroke-opacity="0.2"  stroke-width="1"/>
  </g>

  <!-- swarm nodes -->
  <g>
    <circle cx="812" cy="74"  r="9"  fill="url(#node)"/>
    <circle cx="884" cy="96"  r="6"  fill="#0d1530" stroke="#ebb84a" stroke-width="1.5"/>
    <circle cx="980" cy="70"  r="5"  fill="#0d1530" stroke="#ebb84a" stroke-opacity="0.7" stroke-width="1.3"/>
    <circle cx="860" cy="150" r="11" fill="url(#node)"/>
    <circle cx="1040" cy="128" r="4" fill="#0d1530" stroke="#ebb84a" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="936" cy="186" r="7"  fill="#0d1530" stroke="#f5d98a" stroke-width="1.6"/>
    <circle cx="820" cy="214" r="9"  fill="url(#node)"/>
    <circle cx="1000" cy="210" r="5" fill="#0d1530" stroke="#ebb84a" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="890" cy="252" r="6"  fill="#0d1530" stroke="#ebb84a" stroke-width="1.5"/>
    <circle cx="980" cy="262" r="4"  fill="#0d1530" stroke="#ebb84a" stroke-opacity="0.5" stroke-width="1.1"/>
    <circle cx="1096" cy="172" r="5" fill="#8f7fe0" fill-opacity="0.85"/>
    <circle cx="1058" cy="226" r="4" fill="#8f7fe0" fill-opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="68" y="150" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-3" fill="url(#word)">SWARM</text>
  <text x="72" y="190" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="10.5" fill="#ebb84a">ORCHESTRATOR</text>

  <!-- tagline -->
  <text x="73" y="236" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18.5" fill="#aab2c6">The product loop <tspan fill="#e8ecf5" font-weight="600">past T3 Code</tspan> — worktree isolation, a machine-verifiable</text>
  <text x="73" y="262" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18.5" fill="#aab2c6">ship chain, two agent providers behind one trait, a headless daemon.</text>

  <!-- meta chip -->
  <g>
    <rect x="73" y="284" width="392" height="27" rx="13.5" fill="#ebb84a" fill-opacity="0.08" stroke="#ebb84a" stroke-opacity="0.28"/>
    <text x="88" y="302" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" letter-spacing="0.5" fill="#f0d89a">v0.13.0  ·  Tauri 2  ·  Rust + React 19  ·  4 platforms  ·  MIT</text>
  </g>

  <!-- inner border -->
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="21" fill="none" stroke="#ebb84a" stroke-opacity="0.16"/>
</svg>
