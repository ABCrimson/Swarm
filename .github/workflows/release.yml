name: Release

# A `v*` tag runs the full CI gate, then builds, signs and attests every
# installer and updater bundle plus the swarmd daemon binaries, attaches
# them and latest.json to a DRAFT release, and verifies the result end to
# end. A human publishes the draft:  gh release edit <tag> --draft=false --latest
# (the explicit --latest matters: GitHub does not recompute the "latest
# release" pointer when only the draft/prerelease flags flip).
#
# workflow_dispatch is a tag-free dry run: the same gate and builds with
# signing, no release, no attestations; bundles and binaries are kept as
# workflow artifacts instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Never cancel a release midway: a half-uploaded draft is worse than a
# queued run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.target }})
    needs: ci
    # The updater signing key and its password are secrets of this
    # environment; its deployment policy decides which refs may sign.
    environment: release
    # No artifact-metadata grant: actions/attest only writes storage
    # records for registry pushes from organization-owned repositories.
    permissions:
      contents: write # create the draft release, upload bundles
      id-token: write # Sigstore signing certificate for attestations
      attestations: write # store the build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel builds cross-compile on the arm64 image, like the
          # aarch64 leg, rather than depend on the separate x64 image pool.
          - platform: macos-26
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # glibc floor: the deb and AppImage must run on Debian 12 /
          # Ubuntu 22.04 (glibc 2.35), so they are built in an Ubuntu 22.04
          # container. That keeps the floor independent of the deprecated
          # ubuntu-22.04 hosted image (retired 2027-04-17). Pinned by digest
          # (the multi-arch index of ubuntu:22.04 as of 2026-09-23).
          - platform: ubuntu-26.04
            container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    timeout-minutes: 75
    env:
      TARGET: ${{ matrix.target }}
    # One shell on every leg: without this the Windows leg runs `run:`
    # steps in pwsh, where "$TARGET" is an unset PowerShell variable rather
    # than the job's environment variable.
    defaults:
      run:
        shell: bash
    steps:
      # The container starts bare (root, no sudo). librsvg2 renders the
      # icons and patchelf is needed by the AppImage bundler; nothing links
      # OpenSSL (rustls) or appindicator (no tray).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          # tzdata (pulled in by WebKitGTK) would otherwise wait on a prompt.
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file git \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches anywhere in this job: it holds the signing key, so it
      # must not restore anything another workflow could have written. That
      # rules out pnpm/setup (the one-step setup every other workflow uses):
      # v3 restores its cached lockfile-verification verdict on every run,
      # whatever its `cache` input says. pnpm/action-setup restores nothing.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      # rust-toolchain.toml pins the nightly; CI already denied warnings,
      # so a platform-only warning here must not block shipping.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false
          build-warnings: ""

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign and upload the app
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage tools cannot FUSE-mount themselves inside a container.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # Empty on workflow_dispatch: build only, create no release.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SWARM Orchestrator {0}', github.ref_name) || '' }}
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          # Only semver pre-release tags (v0.14.0-beta.1) are GitHub
          # pre-releases. A plain vX.Y.Z, the 0.x line included, is a full
          # release, so /releases/latest (the updater endpoint's base)
          # resolves to it; flagging all of 0.x as pre-release broke the
          # updater through v0.13.0.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}

      # Shares target/<triple>/release with the app build above.
      - name: Build swarmd
        run: cargo build --release --locked -p swarmd --target "$TARGET"

      - name: Stage swarmd
        run: |
          ext=""
          [[ $RUNNER_OS == Windows ]] && ext=".exe"
          mkdir -p swarmd-out
          cp "target/$TARGET/release/swarmd$ext" "swarmd-out/swarmd-$TARGET$ext"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarmd-${{ matrix.target }}
          path: swarmd-out/
          if-no-files-found: error
          retention-days: 7

      # Provenance for everything this leg published: installers and
      # updater bundles (their .sig files excluded).
      - name: List attestation subjects
        if: github.event_name == 'push'
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node .github/scripts/bundle-subjects.ts

      - name: Attest the bundles
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: bundle-subjects.sha256

  swarmd:
    name: Publish swarmd
    needs: build
    # Publish whatever legs succeeded; verify-swarmd reports the gaps. A
    # skipped build (the CI gate failed) leaves nothing to publish.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # upload to the draft release
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swarmd-*
          path: swarmd
          merge-multiple: true

      - name: Checksum files
        working-directory: swarmd
        run: |
          for binary in swarmd-*; do
            sha256sum "$binary" >"$binary.sha256"
          done
          cat ./*.sha256 >../swarmd-subjects.sha256
          cat ../swarmd-subjects.sha256

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: swarmd-subjects.sha256

      - name: Upload to the draft release
        working-directory: swarmd
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber

  verify-updater-manifest:
    name: Verify Updater Manifest
    needs: build
    # Tag pushes only: a dry run creates no release to verify, and neither
    # does a build skipped because the CI gate failed.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # read the DRAFT release (drafts need push access)
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Verify latest.json signatures, versions and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ATTESTATION_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          bash .github/scripts/verify-updater-manifest.sh latest.json "${TAG#v}"

  verify-swarmd:
    name: Verify swarmd Binaries
    needs: swarmd
    if: ${{ !cancelled() && github.event_name == 'push' && needs.swarmd.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # read the DRAFT release (drafts need push access)
      attestations: read # gh attestation verify
    steps:
      - name: Download from the draft release and verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'swarmd-*' --dir swarmd
          cd swarmd
          status=0
          for binary in swarmd-x86_64-pc-windows-msvc.exe swarmd-aarch64-apple-darwin \
            swarmd-x86_64-apple-darwin swarmd-x86_64-unknown-linux-gnu; do
            if [[ ! -f $binary || ! -f $binary.sha256 ]]; then
              echo "::error::the release is missing $binary or its .sha256"
              status=1
            elif ! sha256sum --check --quiet "$binary.sha256"; then
              echo "::error::$binary does not match its published checksum"
              status=1
            elif ! gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              echo "::error::$binary has no valid build provenance attestation"
              status=1
            else
              echo "$binary: checksum and provenance verified"
            fi
          done
          exit "$status"
