name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "26.7.0"
  # Keep in sync with rust-toolchain.toml
  RUST_TOOLCHAIN: "nightly-2026-08-13"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macos-13 was the last free x86_64 image and its runner pool no
          # longer schedules (observed: 2h+ queued while every other leg ran).
          # Intel builds now cross-compile from the arm64 runner instead.
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # ubuntu-22.04 (NOT ubuntu-latest/24.04): 24.04 ships glibc 2.39, which
          # raises the floor above Debian 12 / Ubuntu 22.04 users. 22.04's glibc
          # 2.35 floor keeps them buildable and still has libwebkit2gtk-4.1-dev.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.platform }}
    # The app lives one level below the repo root.
    defaults:
      run:
        working-directory: swarm-orchestrator
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: swarm-orchestrator/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: swarm-orchestrator/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with swarm-orchestrator/rust-toolchain.toml
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swarm-orchestrator/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: swarm-orchestrator
          # On workflow_dispatch (tag-free bundler dry runs) tagName is empty, so
          # tauri-action builds the bundles without creating any release.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SWARM Orchestrator {0}', github.ref_name) || '' }}
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

  verify-updater-manifest:
    name: Verify Updater Manifest
    needs: build
    # Tag pushes only — dispatch dry runs create no release to verify.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download latest.json from draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern latest.json --output latest.json --clobber

      - name: Assert all four platform keys are present
        run: |
          missing=()
          for key in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k]' latest.json > /dev/null; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::latest.json is missing platform key(s): ${missing[*]}"
            exit 1
          fi
          echo "latest.json carries all four platform keys."
