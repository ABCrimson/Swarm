name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "26.7.0"
  # Keep in sync with rust-toolchain.toml
  RUST_TOOLCHAIN: "nightly-2026-08-21"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macos-13 was the last free x86_64 image and its runner pool no
          # longer schedules (observed: 2h+ queued while every other leg ran).
          # Intel builds now cross-compile from the arm64 runner instead.
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # ubuntu-22.04 (NOT ubuntu-latest/24.04): 24.04 ships glibc 2.39, which
          # raises the floor above Debian 12 / Ubuntu 22.04 users. 22.04's glibc
          # 2.35 floor keeps them buildable and still has libwebkit2gtk-4.1-dev.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.platform }}
    # The app lives one level below the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # On workflow_dispatch (tag-free bundler dry runs) tagName is empty, so
          # tauri-action builds the bundles without creating any release.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SWARM Orchestrator {0}', github.ref_name) || '' }}
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}

      # ── swarmd headless daemon ──
      # Built on BOTH tag pushes and workflow_dispatch dry runs, so a
      # tag-free dispatch validates the build+package across all four
      # targets before any real release. Upload is gated to tag pushes
      # (a dispatch creates no release to attach to), mirroring how the
      # tauri-action step above only publishes when tagName is non-empty.
      - name: Build swarmd daemon
        run: cargo build --release --manifest-path src-tauri/Cargo.toml -p swarmd --target ${{ matrix.target }}

      - name: Package swarmd binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "${{ matrix.platform }}" = "windows-latest" ] && ext=".exe"
          src="src-tauri/target/${{ matrix.target }}/release/swarmd${ext}"
          out="swarmd-${{ matrix.target }}${ext}"
          cp "$src" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi
          echo "SWARMD_ARTIFACT=$out" >> "$GITHUB_ENV"

      - name: Upload swarmd to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "$SWARMD_ARTIFACT" "$SWARMD_ARTIFACT.sha256" \
            --repo "${{ github.repository }}" --clobber

  verify-updater-manifest:
    name: Verify Updater Manifest
    needs: build
    # Tag pushes only — dispatch dry runs create no release to verify.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download latest.json from draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern latest.json --output latest.json --clobber

      - name: Assert all four platform keys are present
        run: |
          missing=()
          for key in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k]' latest.json > /dev/null; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::latest.json is missing platform key(s): ${missing[*]}"
            exit 1
          fi
          echo "latest.json carries all four platform keys."

  verify-swarmd-binaries:
    name: Verify swarmd Binaries
    needs: build
    # Tag pushes only — dispatch dry runs attach nothing to verify.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Assert all four swarmd binaries are attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          missing=()
          for target in \
            x86_64-pc-windows-msvc.exe \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu; do
            name="swarmd-$target"
            if ! grep -qxF "$name" <<< "$assets"; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::release is missing swarmd binary(ies): ${missing[*]}"
            exit 1
          fi
          echo "All four swarmd binaries are attached to the release."
