name: Deploy Docs to Pages

# docs/*.md is the only content source: scripts/build-site.ts renders it into
# site/_template.html and writes the whole site to dist-site/.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build-site.ts"
      # The landing page's version chip and the pinned marked version.
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time. A newer push waits for the in-flight deploy instead
# of cancelling it mid-publish (GitHub's starter-workflow default).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm (packageManager), the pinned Node (devEngines.runtime) and a
      # frozen-lockfile install in one step, as in ci.yml. The output is
      # published, so no store cache (`cache` defaults to false): a clean
      # install from the registry.
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true

      - name: Build the site
        run: pnpm build:site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
