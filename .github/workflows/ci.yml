name: CI

# Every gate from AGENTS.md, on every push and PR to main. release.yml runs
# this same workflow (workflow_call) and builds nothing until it is green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

# One run per PR (a new push cancels the stale one) and one per pushed ref.
# `event_name` keeps a release's nested CI run (event `push` on a tag, or
# `workflow_dispatch`) out of the main-branch queue, so a main push can
# never cancel it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm (packageManager), the pinned Node (devEngines.runtime) and a
      # frozen-lockfile install in one step.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Type check
        run: pnpm typecheck

      - name: Biome
        run: pnpm exec biome ci .

      # Unit tests plus the coverage floor in vitest.config.ts.
      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build (desktop bundle)
        run: pnpm build

      - name: Build (browser UI for swarmd --serve-ui)
        run: pnpm build:web

      - name: React Compiler coverage
        run: pnpm check:compiler

      - name: React Compiler on the WASI binding
        run: pnpm check:compiler
        env:
          NAPI_RS_FORCE_WASI: "true"

      - name: Docs site
        run: pnpm build:site

  # Dead files, unused dependencies and (as warnings until the polish phase
  # promotes them) unused exports; knip.jsonc gives a reason for every entry
  # and ignore. Needs no build, only the installed dependencies.
  knip:
    name: Knip
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: knip
        run: pnpm exec knip --treat-config-hints-as-errors

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Headless shell only: every project in playwright.config.ts runs
      # headless, so the full headed Chromium would be dead weight.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # With CI set, playwright.config.ts builds the production bundle and
      # serves it with `vite preview` (not the dev server).
      # --shuffle randomizes spec order each run: the suite must not depend on it.
      - name: Playwright
        run: pnpm test:e2e --shuffle

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Explicit images: the *-latest labels move to new OS releases on
        # GitHub's schedule, not ours. Every cfg(windows) / cfg(target_os =
        # "macos") path is linted and tested before it reaches a release.
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK and its GTK/libsoup/JavaScriptCore stack are the only
      # system libraries the workspace links on Linux (rustls: no OpenSSL;
      # no tray, so no appindicator).
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev

      # The agent-adapter tests drive fake CLIs written as Node scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      # No `toolchain` input: rust-toolchain.toml is the single source of
      # the pinned nightly. Rustc warnings are denied (build-warnings
      # default), and only main writes the cache so PRs cannot evict it.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --all-targets

      # Doctests run for the Tauri-free crates only. On Windows, tauri-build's
      # static VC runtime support writes a stub msvcrt.lib into the desktop
      # crate's OUT_DIR and adds that directory as a native link-search path;
      # cargo hands the path to every workspace doctest, which then links the
      # stub without the /NODEFAULTLIB flags that only the desktop crate's own
      # executables get, and fails on __CxxFrameHandler3 (PR #40, run
      # 38556067556). Scoping doctests to swarm-core and swarmd keeps the
      # desktop build script out of their link plan.
      - name: Doctests
        run: cargo test --locked --doc -p swarm-core -p swarmd

  rust-policy:
    name: Rust Policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Format
        run: cargo fmt --all --check

      # `--prefix none --format "{p}"` prints one bare "name version" per
      # line, so an anchored ^tauri match cannot hit a path that merely
      # contains "src-tauri". swarmd is checked on its own: a tauri crate
      # added straight to its manifest would not show up under swarm-core.
      # The tree is captured before grepping so a failing `cargo tree`
      # fails the step instead of reading as "no tauri found".
      - name: swarm-core and swarmd stay Tauri-free
        run: |
          status=0
          for crate in swarm-core swarmd; do
            deps=$(cargo tree --locked -p "$crate" -e normal --prefix none --format "{p}")
            if grep -E "^tauri" <<<"$deps"; then
              echo "::error::$crate must not depend on tauri (directly or transitively)"
              status=1
            fi
          done
          exit "$status"

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, bans and sources, per the root deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: --hide-inclusion-graph

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install-action ships no actionlint manifest (its fallback to cargo-binstall
      # fails: actionlint is a Go binary, not a crate), so the release tarball is
      # fetched from rhysd/actionlint and checked against the published sha256.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"
          rm actionlint actionlint.tar.gz

      - name: actionlint
        # YAML single quotes keep the shell's double quotes (shellcheck SC2086).
        run: '"$RUNNER_TEMP/actionlint"'

      # Annotations instead of a SARIF upload: no security-events grant, and
      # findings still fail the job. Online audits check every pinned SHA
      # against its `# vX.Y.Z` comment and known-vulnerable action versions.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.32.0rc1
          advanced-security: false
          annotations: true

  # The single status to require in branch rules: green only when every
  # gate above passed.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [frontend, knip, e2e, rust, rust-policy, cargo-deny, workflows]
    # A shell loop needs no full VM.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
