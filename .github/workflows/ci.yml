name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "26.7.0"
  # Keep in sync with rust-toolchain.toml
  RUST_TOOLCHAIN: "nightly-2026-08-13"

jobs:
  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    # The app lives one level below the repo root.
    defaults:
      run:
        working-directory: swarm-orchestrator
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: swarm-orchestrator/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: swarm-orchestrator/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome ci .

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

  lint-backend:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with swarm-orchestrator/rust-toolchain.toml
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swarm-orchestrator/src-tauri

      - name: Clippy
        working-directory: swarm-orchestrator/src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: Rust tests
        working-directory: swarm-orchestrator/src-tauri
        run: cargo test --workspace

      - name: Rust format check
        working-directory: swarm-orchestrator/src-tauri
        run: cargo fmt --all -- --check

      - name: Verify swarm-core has no Tauri dependency
        working-directory: swarm-orchestrator/src-tauri
        run: |
          # Skip the root package line (tail -n +2) — the checkout path
          # itself contains "src-tauri", which would otherwise false-
          # positive a plain grep across the whole tree output.
          if cargo tree -p swarm-core -e normal | tail -n +2 | grep -qi tauri; then
            echo "::error::swarm-core must not depend on tauri (directly or transitively)"
            cargo tree -p swarm-core -e normal | tail -n +2 | grep -i tauri
            exit 1
          fi
